name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: System packages
        # tesseract for the OCR tests (skipped without it), cairo for the symbol rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn libcairo2
      - name: Lint
        run: uvx ruff@0.17.2 check .
      - name: Copies of shared scripts agree
        run: python3 .agents/skills/check_skills.py
      - name: README results table agrees with evals/results
        run: python3 evals/scripts/results_table.py --check
      - name: Tests
        # network tests stay skipped: they call the self-hosted servers, never public ones
        run: python3 run_tests.py
